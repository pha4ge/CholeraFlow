name: Codex maintenance every two hours
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: codex-maintenance
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'pha4ge/CholeraFlow' &&
      github.ref_name == github.event.repository.default_branch &&
      vars.CODEX_MAINTENANCE_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      base_sha: ${{ github.sha }}
    steps:
      - name: Require a key and avoid a backlog of agent pull requests
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Set the OPENAI_API_KEY repository secret to activate maintenance.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending=$(gh pr list --state open --limit 1000 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("ai/maintenance-"))] | length')
          if [ "$pending" -gt 0 ]; then
            echo 'Maintenance paused while an existing agent PR awaits human review.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  propose:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-validation
      - name: Check the baseline before spending API tokens
        run: bash scripts/validate.sh
      - name: Propose one maintenance improvement
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/maintenance.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL }}
      # Only export the diff after the agent; no repository code runs in this job.
      - name: Export proposed changes including new files
        run: |
          git add --intent-to-add --all
          git diff --binary --no-ext-diff > "$RUNNER_TEMP/maintenance.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-maintenance
          path: ${{ runner.temp }}/maintenance.patch
          retention-days: 7

  verify:
    needs: [preflight, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: proposed-maintenance
          path: ${{ runner.temp }}/proposal
      - name: Validate scope with the trusted base version before applying
        id: patch
        env:
          PATCH: ${{ runner.temp }}/proposal/maintenance.patch
        run: |
          python3 scripts/check_maintenance_patch.py "$PATCH"
          if [ -s "$PATCH" ]; then
            git apply --index "$PATCH"
            git diff --cached --check
            echo "sha256=$(sha256sum "$PATCH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-validation
        if: steps.patch.outputs.changed == 'true'
      - name: Independently validate the patch with no API key or write token
        if: steps.patch.outputs.changed == 'true'
        run: bash scripts/validate.sh
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: verified-maintenance
          path: ${{ runner.temp }}/proposal/maintenance.patch
          retention-days: 7

  publish:
    needs: [preflight, verify]
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-maintenance
          path: ${{ runner.temp }}/verified
      - name: Publish a draft pull request for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          EXPECTED_PATCH_SHA: ${{ needs.verify.outputs.patch_sha256 }}
          PATCH: ${{ runner.temp }}/verified/maintenance.patch
        run: |
          set -euo pipefail
          actual_sha=$(sha256sum "$PATCH" | cut -d ' ' -f 1)
          test "$actual_sha" = "$EXPECTED_PATCH_SHA"
          # A changed default branch requires a fresh proposal and fresh checks.
          current=$(gh api "repos/$GH_REPO/commits/$BASE_BRANCH" --jq .sha)
          if [ "$current" != "$BASE_SHA" ]; then
            echo 'Default branch changed during validation; defer to the next scheduled run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/check_maintenance_patch.py "$PATCH"
          branch="ai/maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git apply --index "$PATCH"
          git diff --cached --check
          git config user.name 'choleraflow-maintenance[bot]'
          git config user.email 'choleraflow-maintenance[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --no-verify -m 'chore: propose tested CholeraFlow maintenance'
          git push origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<'MD'
          This scheduled OpenAI Codex proposal addresses one maintenance issue.
          Review the diff for the exact behavior change and scientific implications.

          Validation passed in a separate job: Python regression tests, compilation,
          Nextflow 24.10.5 configuration/preview, and a synthetic workflow smoke test.
          Container tools and real genomic analyses were not validated by this job.

          Human review is required. This workflow never merges changes.
          MD
          printf '\nWorkflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pr-body.md"
          gh pr create --draft --base "$BASE_BRANCH" --head "$branch" \
            --title 'chore: tested CholeraFlow maintenance proposal' \
            --body-file "$RUNNER_TEMP/pr-body.md"
